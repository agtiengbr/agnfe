name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Validate and publish PrestaShop module ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up PHP with DOM
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom
          coverage: none

      - name: Validate PHP and documents
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/validation.php

      - name: Build versioned PrestaShop ZIP
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/build-release.py "${RELEASE_TAG#v}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: dist/agnfe-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
